# =============================================================================
# DEBEZIUM SERVER CONFIGURATION (MRC-CHT-HD-01 Chapter XII)
# Location: mrc/infrastructure/debezium/conf/application.properties
# Purpose: Capture CDC events from Miracle CRM PostgreSQL WAL (pgoutput)
# =============================================================================

# ---- 1. Nguồn: PostgreSQL CRM Miracle ----
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.topic.prefix=crm
debezium.source.database.hostname=${CRM_DB_HOST:-crm-postgres}
debezium.source.database.port=${CRM_DB_PORT:-5432}
debezium.source.database.user=${DBZ_CRM_USER:-dbz_crm}
debezium.source.database.password=${DBZ_CRM_PASSWORD}
debezium.source.database.dbname=${CRM_DB_NAME:-crm}
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=dbz_crm_hr
debezium.source.publication.name=dbz_crm_hr
debezium.source.publication.autocreate.mode=disabled

# Danh sách bảng theo dõi nhân sự (Đã đối chiếu mô hình CRM thực tế):
# - public.users (Nhân sự)
# - public.org_units (Phòng ban/Đơn vị)
# - public.user_org_membership (Phân bổ nhân sự đơn vị)
# - public.resignation_decisions (Quyết định nghỉ việc)
debezium.source.table.include.list=public.users,public.org_units,public.user_org_membership,public.resignation_decisions

# Tuyệt đối không phát tán cột nhạy cảm ra CDC:
debezium.source.column.exclude.list=public.users.password_hash,public.users.session_token,public.users.id_card_no

debezium.source.snapshot.mode=initial
debezium.source.heartbeat.interval.ms=60000

# ---- 2. Đích phát sự kiện: HTTP / Webhook tới iam-sync / rc-sync ----
debezium.sink.type=http
debezium.sink.http.url=http://iam-sync:8000/api/v1/cdc/events
