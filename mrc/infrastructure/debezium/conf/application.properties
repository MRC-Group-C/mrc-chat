# =============================================================================
# DEBEZIUM SERVER CONFIGURATION (MRC-CHT-HD-01 Section 12.4)
# Location: mrc/infrastructure/debezium/conf/application.properties
# Purpose: Capture HR changes from the CRM PostgreSQL WAL (pgoutput)
# Schema:  mrc/docs/crm-schema-mapping.md
# =============================================================================

# ---- Nguồn: PostgreSQL CRM ----
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.topic.prefix=crm
debezium.source.database.hostname=${CRM_DB_HOST}
debezium.source.database.port=5432
debezium.source.database.user=dbz_crm
debezium.source.database.password=${DBZ_CRM_PASSWORD}
debezium.source.database.dbname=${CRM_DB_NAME}
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=dbz_crm_hr
debezium.source.publication.name=dbz_crm_hr
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.users,public.org_units,public.user_org_membership,public.resignation_decisions

# Không bao giờ phát cột nhạy cảm (danh sách và lý do: docs/crm-schema-mapping.md)
debezium.source.column.exclude.list=public.users.password_hash,public.users.phone,public.users.date_of_birth,public.users.token_version,public.users.must_change_password,public.users.temp_password_issued_at,public.resignation_decisions.employee_name,public.resignation_decisions.reason,public.resignation_decisions.extra_terms,public.resignation_decisions.return_reason,public.resignation_decisions.revoke_reason

debezium.source.snapshot.mode=initial
debezium.source.heartbeat.interval.ms=60000
debezium.source.tombstones.on.delete=false

# Lưu vị trí đã đọc (offset) trên đĩa bền
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=5000

# ---- Định dạng: JSON gọn, giữ trạng thái trước/sau ----
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

# ---- Đích: HTTP tới iam-sync ----
debezium.sink.type=http
debezium.sink.http.url=${IAM_SYNC_CDC_URL}
debezium.sink.http.timeout.ms=10000
debezium.sink.http.retries=10
debezium.sink.http.retry.interval.ms=3000
debezium.sink.http.authentication.type=standard-webhooks
# Bí mật ký HMAC-SHA256 theo đặc tả Standard Webhooks
debezium.sink.http.authentication.webhook.secret=${DBZ_WEBHOOK_SECRET}

quarkus.log.console.json=true
