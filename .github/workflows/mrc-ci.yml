name: MRC CI

on:
  push:
    paths:
      - 'mrc/**'
      - '.github/workflows/mrc-ci.yml'
  pull_request:
    paths:
      - 'mrc/**'
      - '.github/workflows/mrc-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r mrc/requirements-dev.txt
      - run: python -m pytest mrc/tests -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the current tree, not history: old commits still hold values that
      # were exposed before they were removed from the code.
      - name: Scan mrc/ for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 dir /repo/mrc --redact --exit-code 1
